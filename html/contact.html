<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> contact us ☎</title>
    <link rel="icon" href="../picture/view/888f32282dbae6ee6ac307da44e259a4.jpg">
</head>

<body>
    <h1>contact us ☎</h1>
    <br> <br>
    <form action="../html/form.html">
        <div>
            <label for="name">full name:</label>
            <input required placeholder="write your full name" type="text" name="name" id="name">
        </div>
        <br> <br>

        <div>
            <label for="email">email:</label>
            <input type="email" name="email" id="email">
        </div>
        <br><br>
        <div>
            <label for="phone_num">phone number:</label>
            <input required placeholder="write your phonenumber" type="tel" name="phone_num" id="phone_num">
        </div>
        <br><br>
        <div>
            <label for="date">date:</label>
            <input type="date" name="date" id="date">
        </div>
        <br><br>
        <div>
            <textarea name="note" rows="5" cols="50" id="note"> the reason of the contact: </textarea>
            <br><br>
        </div>
        <br> <br>


        <div>
            <input type="submit">
        </div>
        <br> <br>


    </form>
    <br> <br>
    <a href="./home.html" id="home_page"> <button>back to home page ➡ </button></a>





    <style>
        #home_page {
            display: flex;
            justify-content: center;
            align-items: center;
            /* padding: 5%;
            padding-top: 25%; */
            margin-top: 25%;
            margin: 5%;
        }

        button {
            border-style: solid;
            border-radius: 30px;
            border-width: 10%;
            border-color: white;
            width: 12%;
            font-size: 11px;
            background-color: white;
        }
        @media only screen and (max-width: 500px) {

button{
    width: 30%;
}







}
    </style>
</body>

</html>
