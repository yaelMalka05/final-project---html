<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pay 🛒</title>

<body>
    <h2>payment form 🛒:</h2>
    <form action="../html/payment.html">
        <div>
            <div>
                <label for="name">full name:</label>
                <input required placeholder="write your full name" type="text" name="name" id="name">
            </div>
            <br> <br>

            <div>
                <label for="email">email:</label>
                <input type="email" name="email" id="email">
            </div>
            <br><br>
            <div>
                <label for="phone_num">phone number:</label>
                <input required placeholder="write your phonenumber" type="tel" name="phone_num" id="phone_num">
            </div>
            <br><br>
            <div>
                <label for="date">date:</label>
                <input type="date" name="date" id="date">
            </div>
            <br><br>
            <div>
                <h4>choose how do you pay :</h4>
                <br>
            </div>
            <div>
                <label for="credit">credit card</label>
                <input type="radio" name="credit" id="credit" value="credit">
            </div>
            <br>
            <div>
                <label for="google_pay">google pay</label>
                <input type="radio" name="google_pay" id="google_pay" value="google_pay">
            </div>
            <br>
            <div>
                <label for="bit">bit</label>
                <input type="radio" name="bit" id="bit" value="bit">
            </div>
            <br> <br>
            <div>
                <textarea name="addres" rows="3" cols="30" id="addres"> addres: </textarea>
                <br><br>
            </div>
            <br> <br>
            <div>
                <input type="submit">
            </div>
            <br> <br>
        </div>
    </form>

    <a href="./home.html" id="home_page"> <button>back to home page ➡</button> </a>
